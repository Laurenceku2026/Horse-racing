name: Auto Backfill Incident LLM

on:
  # 17:30 HKT = 09:30 UTC；23:30 HKT = 15:30 UTC
  schedule:
    - cron: '30 9 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  backfill-incidents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect HKJC season
        id: season
        env:
          HKJC_API_URL: https://hkjc-api-server.onrender.com
        run: |
          STATUS=$(python scripts/hkjc_season_gate.py | tail -n 1)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Season gate: $STATUS"

      - name: Skip backfill (off-season / no fixtures)
        if: steps.season.outputs.status != 'IN_SEASON'
        run: |
          echo "休赛期或无活跃赛日，跳过 incident LLM 补全（不视为失败）。"

      - name: Install dependencies
        if: steps.season.outputs.status == 'IN_SEASON'
        run: pip install requests openai

      - name: Run incident auto backfill
        if: steps.season.outputs.status == 'IN_SEASON'
        env:
          SUPABASE_STOCK_URL: ${{ secrets.SUPABASE_STOCK_URL }}
          SUPABASE_STOCK_SECRET_KEY: ${{ secrets.SUPABASE_STOCK_SECRET_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          INCIDENT_AUTO_MAX_CALLS: '500'
        run: python scripts/auto_backfill_incidents.py
